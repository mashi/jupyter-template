name: ci

# workflow triggers
on:
  push:
    branches:
      - '**' # every branch
    tags:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  pre-commit-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: '3.14'
          enable-cache: true
      - name: pre-commit checks
        run: |
          uv sync --dev
          uv run pre-commit run --all-files

  # check if the makefile recipes are valid
  makefile:
    # needs: [test-and-build, docs] # commented because the serial execution slowed down the CI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: '3.14'
          enable-cache: true
      - name: makefile recipes
        run: |
          make install
          make tests
